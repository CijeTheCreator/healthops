[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=critical        
silent=true             
user=root              

[program:ui]
command=node /app/ui/server.js
directory=/app/ui
environment=PORT=3000,HOSTNAME=0.0.0.0,HOST_IP=%(ENV_HOST_IP)s
autostart=true
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:backend]
command=node_modules/.bin/tsx /app/backend/server.ts
directory=/app/backend
environment=PORT=3005
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
